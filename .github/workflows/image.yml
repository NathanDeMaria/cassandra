name: Image

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR build is wasted CI time, but let pushes to main finish so
# `latest` always corresponds to a commit that's actually on the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  # Where the shared stack keeps its state. The push job reads the bucket name
  # and the ECR URL out of it rather than carrying either as a secret, so this
  # is the one piece of coordinates CI has to know. Matches the default of
  # `shared_infra_state` in jobs/variables.tf; if that ever moves, both move.
  SHARED_STATE_BUCKET: nathan-terraform
  SHARED_STATE_KEY: batch-state

jobs:
  # Before the OIDC role is wired up there is nothing to authenticate with, so
  # every push step below is a no-op and the workflow reports green with a note
  # rather than failing red on every push to main. It gets a job of its own
  # because three jobs below need the answer and it should be decided once.
  #
  # `vars`, not `secrets`: a role ARN isn't one, and this repo has no Actions
  # secrets at all -- the three CI role ARNs are repository variables. Reading
  # the wrong namespace returns empty rather than erroring, which this guard
  # then reads as "not configured", which it reports as success. That is how
  # 8c599ca pushed no image and still went green. Variables *can* be tested in
  # a job-level `if`, unlike secrets, so the env round-trip here is no longer
  # load-bearing -- it stays because the step is also where the note gets
  # written.
  #
  # A pull request answers `false` without looking: a PR builds but never
  # pushes. Nothing wants a PR's image in ECR -- the documented way to get one
  # is `make push TAG=<tag>` from a laptop -- and asking for credentials to
  # prove the Dockerfile still compiles means the check can't run on a fork, or
  # before the repo's roles are set up.
  guard:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for the image role
        id: check
        env:
          ROLE_ARN: ${{ vars.AWS_IMAGE_ROLE_ARN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ROLE_ARN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_IMAGE_ROLE_ARN is not set -- skipping the push." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  # One job per architecture, each on a runner of that architecture.
  #
  # Both are deployable: the compute environment's instance types include
  # Graviton, and which one a job lands on is Batch's choice at scale-up time,
  # so ECR has to hold an image for either. The alternative -- one job building
  # both platforms through QEMU -- works, but emulating an arm64 `poetry
  # install` of numpy, scipy, pyarrow and numba costs far more than the second
  # runner does. arm64 hosted runners are free for public repositories.
  #
  # Neither job writes the tag anything pulls. Each pushes its own
  # architecture under a suffixed tag and the `manifest` job joins them, so
  # `latest` is never briefly a single-architecture image -- hence
  # `TAG_LATEST=false` here, overriding the Makefile's on-main default.
  image:
    needs: guard
    strategy:
      # The two architectures fail for different reasons -- a missing aarch64
      # wheel is not a Dockerfile error -- and seeing only the first is worse
      # than paying for both.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `--output` is empty rather than `--load`: nothing here reads the image
      # back, and the tag is a placeholder because buildx wants something
      # parseable in `-t`.
      - name: Build the image
        if: needs.guard.outputs.configured != 'true'
        run: |
          echo '{}' > config.json
          make build \
            IMAGE_URL=cassandra TAG=pr BUILD_OUTPUT= \
            PLATFORM=linux/${{ matrix.arch }}

      - name: Configure AWS credentials
        if: needs.guard.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `config.json` is what `Config.init_from_file` reads for the bucket
      # name, what the Makefile reads for the ECR URL, and what `jobs.py`
      # reads for the queue name. It used to be a repository secret holding a
      # whole `terraform output -json`; it's derived from the shared stack's
      # state instead, so there is nothing to re-paste when that stack
      # changes.
      #
      # Filtered to the three keys this repo actually reads, which also keeps
      # `ecr_iam_users` out of it: that output is sensitive, it holds live
      # access keys, and the previous secret baked all of it into every image.
      # A missing key here fails now, rather than at `Config.init_from_file`
      # in a Batch job an hour later.
      - name: Build config.json from the shared terraform state
        if: needs.guard.outputs.configured == 'true'
        run: |
          aws s3 cp "s3://${SHARED_STATE_BUCKET}/${SHARED_STATE_KEY}" - \
            | jq --exit-status '{
                bucket: .outputs.bucket,
                repo_urls: .outputs.repo_urls,
                job_queue_name: .outputs.job_queue_name,
              } | if any(.[]; . == null) then error("missing output") else . end' \
            > config.json
          echo "IMAGE_URL=$(jq -r .repo_urls.value.cassandra config.json)" >> "$GITHUB_ENV"

      - name: Push this architecture
        if: needs.guard.outputs.configured == 'true'
        # Layer cache lives in ECR alongside the image rather than in the
        # Actions cache: `type=gha` needs ACTIONS_RUNTIME_TOKEN, which the
        # runner hands to JS actions and withholds from `run:` steps, so a
        # buildx build in the Makefile can't reach it without re-exporting the
        # runner's internals. Registry cache authenticates with the ECR login
        # the push already does, keeping CI and local on one build definition.
        # image-manifest/oci-mediatypes are required -- ECR rejects buildx's
        # default cache manifest format.
        #
        # One cache ref per architecture. A shared one would have the two jobs
        # overwriting each other's manifest for the whole build, and an arm64
        # layer is no use to an amd64 build anyway.
        run: |
          make push \
            TAG=sha-${GITHUB_SHA::7}-${{ matrix.arch }} \
            PLATFORM=linux/${{ matrix.arch }} \
            TAG_LATEST=false \
            CACHE_FLAGS="--cache-from type=registry,ref=${IMAGE_URL}:buildcache-${{ matrix.arch }} \
              --cache-to type=registry,ref=${IMAGE_URL}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true"

  # The tags anything actually pulls. `imagetools create` is registry-side: it
  # reads the two architecture manifests and writes an index pointing at them,
  # so this re-uploads nothing and takes seconds.
  manifest:
    needs: [guard, image]
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Only the repository URL, not the whole config.json the builds need:
      # nothing is built here, so there is no image for a bucket name to end
      # up inside. Same `--exit-status` guard, for the same reason.
      - name: Read the repository URL from the shared terraform state
        run: |
          url="$(aws s3 cp "s3://${SHARED_STATE_BUCKET}/${SHARED_STATE_KEY}" - \
            | jq --exit-status -r '.outputs.repo_urls.value.cassandra')"
          echo "IMAGE_URL=$url" >> "$GITHUB_ENV"

      - name: Join the architectures into one image
        run: make manifest TAG=sha-${GITHUB_SHA::7}
