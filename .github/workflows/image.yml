name: Image

on:
  push:
    branches: [main]
  pull_request:

# A superseded PR build is wasted CI time, but let pushes to main finish so
# `latest` always corresponds to a commit that's actually on the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  # The SSM parameter the shared stack publishes its non-sensitive outputs to.
  # The push job reads the bucket name and the ECR URL out of it rather than
  # carrying either as a secret, so this is the one name CI has to know.
  # Matches the default of `shared_outputs_parameter` in jobs/variables.tf,
  # which also scopes the image role's read to it; if that moves, both move.
  SHARED_OUTPUTS_PARAMETER: /batch/shared-outputs

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A PR builds but does not push. Nothing wants a PR's image in ECR --
      # the documented way to get one is `make push TAG=<sha>` from a laptop
      # -- and asking for credentials to prove the Dockerfile still compiles
      # means the check can't run on a fork, or before the repo's roles are
      # set up. `--output` is empty rather than `--load`: nothing here reads
      # the image back, and the tag is a placeholder because buildx wants
      # something parseable in `-t`.
      - name: Build the image
        if: github.event_name == 'pull_request'
        run: |
          echo '{}' > config.json
          make build IMAGE_URL=cassandra TAG=pr BUILD_OUTPUT=

      # Before the OIDC role is wired up there is nothing to authenticate with,
      # so every push step below is a no-op and the job reports green with a
      # note rather than failing red on every push to main -- the same guard
      # the terraform workflow uses.
      #
      # Skipped entirely on a pull request, which leaves `configured` empty and
      # so keeps every step below it skipped: a PR builds but never pushes.
      - name: Check for the image role
        id: guard
        if: github.event_name == 'push'
        env:
          ROLE_ARN: ${{ vars.AWS_IMAGE_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS_IMAGE_ROLE_ARN is not set -- skipping the push." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.guard.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # `config.json` is what `Config.init_from_file` reads for the bucket
      # name, what the Makefile reads for the ECR URL, and what `jobs.py`
      # reads for the queue name. It used to be a repository secret holding a
      # whole `terraform output -json`; it's derived from the outputs the
      # shared stack publishes instead, so there is nothing to re-paste when
      # that stack changes.
      #
      # Filtered to the three keys this repo actually reads, and re-wrapped as
      # `{"value": ...}` so it keeps the `terraform output -json` shape every
      # reader expects. (The previous secret was the whole output, sensitive
      # `ecr_iam_users` access keys included, baked into every image.)
      # A missing key here fails now, rather than at `Config.init_from_file`
      # in a Batch job an hour later.
      - name: Build config.json from the shared stack's outputs
        if: steps.guard.outputs.configured == 'true'
        run: |
          aws ssm get-parameter --name "$SHARED_OUTPUTS_PARAMETER" \
              --query Parameter.Value --output text \
            | jq --exit-status '{bucket, repo_urls, job_queue_name}
                | if any(.[]; . == null) then error("missing output")
                  else map_values({value: .}) end' \
            > config.json
          echo "IMAGE_URL=$(jq -r .repo_urls.value.cassandra config.json)" >> "$GITHUB_ENV"

      - name: Push the image
        if: steps.guard.outputs.configured == 'true'
        # Layer cache lives in ECR alongside the image rather than in the
        # Actions cache: `type=gha` needs ACTIONS_RUNTIME_TOKEN, which the
        # runner hands to JS actions and withholds from `run:` steps, so a
        # buildx build in the Makefile can't reach it without re-exporting the
        # runner's internals. Registry cache authenticates with the ECR login
        # the push already does, keeping CI and local on one build definition.
        # image-manifest/oci-mediatypes are required -- ECR rejects buildx's
        # default cache manifest format.
        run: |
          make push TAG=${GITHUB_SHA::7} \
            CACHE_FLAGS="--cache-from type=registry,ref=${IMAGE_URL}:buildcache \
              --cache-to type=registry,ref=${IMAGE_URL}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
