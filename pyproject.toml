endgame_aws = {git = "https://github.com/NathanDeMaria/EndGame.git", rev = "1babc5662d900a6d2478fdb2686996df1def38ba", subdirectory = "py-endgame-aws"}
aiofiles = "^25.1.0"
pandas = "^2.3.3"
pydantic = "^2.12.5"
statsmodels = "^0.14.6"
scikit-learn = "^1.8.0"
