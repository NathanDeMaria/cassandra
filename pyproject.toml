[tool.poetry]
name = "cassandra"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.14"
# The game and season types, and nothing that fetches them. Every predictor
# and the release schema read `endgame.types.Game`, so this is genuinely a
# serving dependency -- unlike `endgame_aws`, which reads the bucket those
# games are stored in and now lives in the `fit` group below.
#
# Pinned to the rev `endgame_aws` resolves it at, so the two never disagree
# about what a Game is. Bump them together.
endgame = {git = "https://github.com/NathanDeMaria/EndGame.git", rev = "f0be488a26c9bcf60a21ba00146581779485e852", subdirectory = "py-endgame"}
# Team knowledge: which names are the same team, and what division and
# conference each played in. Pure python apart from its extras, so it costs a
# serving install one dependency it already has.
#
# Pinned to a rev like endgame_aws is: unpinned, `poetry install` moves the
# team data under a replay without anything in the diff saying so, and a
# team's rating history depends on its identity being the same from one run
# to the next. Bump it deliberately with `poetry update`.
call-it-what-you-want = {git = "https://github.com/NathanDeMaria/call-it-what-you-want.git", rev = "15f23685a42466d3273a18430c19d2b5daee2586"}
aiofiles = "^25.1.0"
numpy = "^2.4.0"
pandas = "^2.3.3"
pydantic = "^2.12.5"


# Fitting and CLI, not serving. A consumer that installs cassandra as a
# dependency -- the webapp -- gets `main` and nothing else, because poetry
# groups never make it into package metadata. That's what keeps scikit-learn
# out of a web image whose only job is to read a saved calibration and call
# np.interp on it. `poetry install` here still picks this up with no flags, so
# local dev and CI are unaffected.
#
# The cost: `pip install cassandra` gives you a package that can rehydrate a
# fit but not produce one. IsotonicProbToMarginFitter.fit imports sklearn
# lazily so the ImportError lands there rather than at import time, and
# `cassandra/__init__.py` defers its fit-path re-exports for the same reason.
[tool.poetry.group.fit.dependencies]
scikit-learn = "^1.8.0"
fire = "^0.7.1"
bayesian-optimization = "^3.2.1"
# Where the seasons, the odds and the play-by-play live. Only `cassandra.odds`
# and `cassandra.save_predictions` import it, and neither is on the path a
# consumer reading a release takes -- so it belongs here with the rest of the
# fitting stack rather than in package metadata.
#
# It is here rather than in `main` because of what it carries: aiobotocore,
# and pyarrow at ~152MB. A web image that reads a calibration and calls
# np.interp has no use for either. `import_boundary_test.py` is what keeps
# that true.
#
# The rev is the one that adds the processed play-by-play layer -- the weekly
# parquet `cassandra.game_control` reads -- and is deliberately the same rev
# `lucky-ones` pins below, so the two packages that read that layer agree on
# `PLAY_SCHEMA` rather than each having its own idea of it. Later revs only
# touch the write side (a yardline clamp), which is nothing cassandra does.
endgame_aws = {git = "https://github.com/NathanDeMaria/EndGame.git", rev = "26646aa4c3f77422a500603710f6b662fe94305e", subdirectory = "py-endgame-aws"}
# In-game win probability, and the `game_control` number cassandra turns into
# an alternate score line. The fits ship inside the package, so pinning the
# rev pins the model: which win probability curve a rating was built against
# has one answer, the way `call-it-what-you-want` pins team identity.
#
# `data` is pyarrow, for `lucky_ones.arrow` -- the adapter from endgame's
# stored parquet, and the only part of the package cassandra imports that
# needs it. Declared rather than left to endgame_aws's pyarrow, so the import
# is backed by something that says why it's there.
#
# Deliberately *not* lucky-ones' `fit` extra, despite this being cassandra's
# `fit` group: the two names mean opposite things here. That extra is the
# scikit-learn that produces a win probability fit, and cassandra produces
# none -- it reads the one that ships inside the package. The scikit-learn
# above is cassandra's own, for the prob-to-margin calibration.
lucky-ones = {git = "https://github.com/NathanDeMaria/the-lucky-ones.git", rev = "d253c4b9ef266aab50afce435bf3d2b3ae50eb96", extras = ["data"]}


[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
pytest = "^9.0.2"
pylint = "^4.0.4"
ruff = "^0.14.10"
types-aiofiles = "^25.1.0.20251011"
ipykernel = "^7.1.0"
matplotlib = "^3.10.8"
pandas-stubs = "^2.3.3.251219"
scikit-learn-stubs = "^0.0.3"
ty = "^0.0.65"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["cassandra"]

[tool.ty.src]
# scratch analysis, not worth keeping type-clean
exclude = ["reasoning"]

[tool.pylint.messages_control]
disable = ["missing-module-docstring", "missing-function-docstring"]
