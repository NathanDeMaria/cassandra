[tool.poetry]
name = "cassandra"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.14"
endgame_aws = {git = "https://github.com/NathanDeMaria/EndGame.git", rev = "0c21854d76a0b5ddb8f71842cb4ddb1ecc2f0408", subdirectory = "py-endgame-aws"}
aiofiles = "^25.1.0"
pandas = "^2.3.3"
pydantic = "^2.12.5"
statsmodels = "^0.14.6"
scikit-learn = "^1.8.0"
tqdm = "^4.67.1"
fire = "^0.7.1"
bayesian-optimization = "^3.2.1"


[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
pytest = "^9.0.2"
pylint = "^4.0.4"
ruff = "^0.14.10"
types-aiofiles = "^25.1.0.20251011"
ipykernel = "^7.1.0"
matplotlib = "^3.10.8"
pandas-stubs = "^2.3.3.251219"
scikit-learn-stubs = "^0.0.3"
ty = "^0.0.65"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["cassandra"]

[tool.ty.src]
# scratch analysis, not worth keeping type-clean
exclude = ["reasoning"]

[tool.pylint.messages_control]
disable = ["missing-module-docstring", "missing-function-docstring"]
