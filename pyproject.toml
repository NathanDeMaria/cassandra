[tool.poetry]
name = "cassandra"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.14"
# The game and season types, and nothing that fetches them. Every predictor
# and the release schema read `endgame.types.Game`, so this is genuinely a
# serving dependency -- unlike `endgame_aws`, which reads the bucket those
# games are stored in and now lives in the `fit` group below.
#
# Pinned to the rev `endgame_aws` resolves it at, so the two never disagree
# about what a Game is. Bump them together.
#
# Still carries ncaawvb -- women's college volleyball, `models/ncaawvb/`. It
# is a `DailyLeague`, so a season pickle arrives as a single Week and
# `iter_weeks` rebuilds ~17 calendar weeks out of the game dates; nothing
# here had to change for that, but it is the reason the raw `.weeks` count
# looks wrong if you go looking.
#
# Moved forward for the odds fetch, which cassandra never calls -- it reads
# the snapshots out of the bucket rather than asking ESPN. It is bumped
# anyway because the rule above says so: `endgame_aws` resolves `endgame` at
# this rev now, and the two disagreeing about what a Game is would be a much
# worse problem than a pin nobody needed. EndGame #85 and #86; the fix is
# why the odds database stops being three-quarters empty.
endgame = {git = "https://github.com/NathanDeMaria/EndGame.git", rev = "9ec6c0f43018f43b5eb037ad8856aefaff6bd93c", subdirectory = "py-endgame"}
# Team knowledge: which names are the same team, and what division and
# conference each played in. Pure python apart from its extras, so it costs a
# serving install one dependency it already has.
#
# Pinned to a rev like endgame_aws is: unpinned, `poetry install` moves the
# team data under a replay without anything in the diff saying so, and a
# team's rating history depends on its identity being the same from one run
# to the next. Bump it deliberately with `poetry update`.
call-it-what-you-want = {git = "https://github.com/NathanDeMaria/call-it-what-you-want.git", rev = "090767f122c6808ca3a0ccfb5305d04f5d7772e7"}
# What changed about a team between seasons -- head-coach changes and why,
# coordinators, quarterback seasons -- and the play-text quarterback parser
# `cassandra.qb_out_build` reads starters with, which lived here as
# `cassandra.qb` until the quarterback file needed it too. Its base install is
# call-it-what-you-want alone; the `plays` extra that rebuilds its
# quarterback file is not taken, since cassandra only reads.
#
# Pinned like call-it-what-you-want, for the same reason: the offseason facts
# a replay reads should move only with a deliberate bump.
say-youll-remember-me = {git = "https://github.com/NathanDeMaria/say-youll-remember-me.git", rev = "4ca747646aa2a2112889279f93ebc96ccd4e0122"}
aiofiles = "^25.1.0"
numpy = "^2.4.0"
pandas = "^2.3.3"
pydantic = "^2.12.5"


# Fitting and CLI, not serving. A consumer that installs cassandra as a
# dependency -- the webapp -- gets `main` and nothing else, because poetry
# groups never make it into package metadata. That's what keeps scikit-learn
# out of a web image whose only job is to read a saved calibration and call
# np.interp on it. `poetry install` here still picks this up with no flags, so
# local dev and CI are unaffected.
#
# The cost: `pip install cassandra` gives you a package that can rehydrate a
# fit but not produce one. IsotonicProbToMarginFitter.fit imports sklearn
# lazily so the ImportError lands there rather than at import time, and
# `cassandra/__init__.py` defers its fit-path re-exports for the same reason.
[tool.poetry.group.fit.dependencies]
scikit-learn = "^1.8.0"
# Parquet, for `history.parquet` and `predictions.parquet`. pandas resolves
# the engine inside `to_parquet`/`read_parquet` rather than at import, which
# is what lets `cassandra.serving.history` and `.predictions` define their
# schemas and build their rows in a serving install that has no pyarrow --
# `predictions_test.test_the_schemas_import_without_pyarrow` holds that.
# Only the reads and writes need this, and only the fitting side calls them.
#
# So it is here rather than in `main`, for the reason `endgame_aws` is: at
# ~152MB it is the single biggest thing that could land in a web image, and
# the whole point of the split is that the image reading a release never
# pays for it. The webapp does have pyarrow -- it reads endgame's play-by-
# play -- so it can read these two files; it just doesn't get it from us.
#
# Declared rather than left to endgame_aws's and lucky-ones' transitive
# copy, the same call `lucky-ones`' `data` extra is documented as making
# below: an import in this repo should be backed by something that says why
# it's there.
pyarrow = "^25.0.1"
fire = "^0.7.1"
bayesian-optimization = "^3.2.1"
# Where the seasons, the odds and the play-by-play live. Only `cassandra.odds`
# and `cassandra.save_predictions` import it, and neither is on the path a
# consumer reading a release takes -- so it belongs here with the rest of the
# fitting stack rather than in package metadata.
#
# It is here rather than in `main` because of what it carries: aiobotocore,
# and pyarrow at ~152MB. A web image that reads a calibration and calls
# np.interp has no use for either. `import_boundary_test.py` is what keeps
# that true.
#
# The rev is the one that adds the processed play-by-play layer -- the weekly
# parquet `cassandra.game_control` reads -- and it agrees with the rev
# `lucky-ones` pins below about `PLAY_SCHEMA`, rather than the two packages
# that read that layer each having their own idea of it.
#
# Moved forward for the odds pull. `PLAY_SCHEMA` is byte-identical between
# this rev and the last one, so the agreement that matters still holds; what
# did change on the way is the write side (a blank start yardline is filled
# from the previous play's end) and the odds fetch, neither of which
# cassandra does.
#
# What cassandra does get is a bucket that stops being quietly short. The
# `today` pull was asking ESPN for a page of 1000 and being handed its
# default of 25, so an FBS Saturday arrived cut from 80 priced games to 25 --
# which is most of why `market_gap` has 184 lined games to work with across
# 75,111. EndGame #85 fixes the limit and fails the pull on the shapes that
# would hide the next one; #86 is the pin that makes the fix reach the job.
endgame_aws = {git = "https://github.com/NathanDeMaria/EndGame.git", rev = "78f76618b2b81cebb4a161775e057fb97d691d18", subdirectory = "py-endgame-aws"}
# In-game win probability, and the `game_control` number cassandra turns into
# an alternate score line. The fits ship inside the package, so pinning the
# rev pins the model: which win probability curve a rating was built against
# has one answer, the way `call-it-what-you-want` pins team identity.
#
# This rev adds expected points and `epa_per_play` -- what a snap was worth
# and how much each offense moved that, which is the signal
# `cassandra.predictor.control` names as the one worth building next.
# `cassandra.predictor.epa` is the index and `BlendedMarginEloPredictor` is
# what reads it.
#
# On `main`, which it wasn't when this pin first landed: the work was reviewed
# and rebased in, so the sha moved while the tree did not. This rev and the
# branch head it replaces (`97f86de`) are byte-identical and all four shipped
# `run_id`s are unchanged, so nothing cassandra reads is different for the
# swap -- but an index swept at the old sha would still rebuild, since the
# fit headers key on the commit rather than on `run_id`.
#
# One thing moves underneath the sweep that already runs, and it is worth
# knowing before the next one. The win probability fits are retrained here:
# a timeout stopped counting as a snap and a college kickoff stopped being
# one, so `run_id` changes, the coefficients move and the NFL fit drops
# ~50,000 training snaps. Every number in a stored
# `{league}_game_control.json` came from the old fit, so the next `jobs.py
# game-control` rebuilds each league from scratch rather than topping it up
# -- which is `ControlFit` working, not a fault -- and the control numbers it
# writes will not be identical to the ones before it.
# Nothing scheduled reads that index, so nothing published moves with it.
#
# `99e79fb` reads the pre-2014 feed the way it was written, and refits on
# that read. The old feed puts
# a down of -1 on the try, so every extra point was priced as a first and
# goal from the 3 that ended at nothing -- minus six, six times a game --
# and about one score in six had its flag and its jump a row apart, or the
# touchdown row missing with its seven on the try. Both leagues' EPA before
# 2014 sat 0.12 points per play below the seasons after, with a third less
# spread, and `lucky_ones.points.FIRST_LEGIBLE_SEASON` is the package's own
# name for the boundary. The four fits are refit through the fixed read;
# they score the same on the same games (NFL win probability 0.1657 against
# 0.1658 brier), but their `run_id`s move, and the NFL ones see ~600 more
# games whose home side the scrambled scoring used to hide. The package
# default for the garbage-time weighting also moves here, to the 0.5
# `cassandra.epa_build` had already pinned. The `EpaFit` and `ControlFit`
# headers key on the commit, so both indexes rebuild from scratch on the
# next sweep -- see `cassandra.epa_build` for where the EPA one now starts.
#
# `data` is pyarrow, for `lucky_ones.arrow` -- the adapter from endgame's
# stored parquet, and the only part of the package cassandra imports that
# needs it. Declared rather than left to endgame_aws's pyarrow, so the import
# is backed by something that says why it's there.
#
# Deliberately *not* lucky-ones' `fit` extra, despite this being cassandra's
# `fit` group: the two names mean opposite things here. That extra is the
# scikit-learn that produces a win probability fit, and cassandra produces
# none -- it reads the one that ships inside the package. The scikit-learn
# above is cassandra's own, for the prob-to-margin calibration.
lucky-ones = {git = "https://github.com/NathanDeMaria/the-lucky-ones.git", rev = "99e79fb9ed68deef0800b53d580677d1036b1dca", extras = ["data"]}


[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
pytest = "^9.0.2"
pylint = "^4.0.4"
ruff = "^0.14.10"
types-aiofiles = "^25.1.0.20251011"
ipykernel = "^7.1.0"
matplotlib = "^3.10.8"
pandas-stubs = "^2.3.3.251219"
scikit-learn-stubs = "^0.0.3"
ty = "^0.0.65"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["cassandra"]

[tool.ty.src]
# scratch analysis, not worth keeping type-clean
exclude = ["reasoning"]

[tool.pylint.messages_control]
disable = ["missing-module-docstring", "missing-function-docstring"]
